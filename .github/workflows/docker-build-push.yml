name: Build and Push Docker Image with SBOM and Provenance

on:
  push:
    branches: [ main ]
    paths:
      - '**/app.js'
      - '**/app.test.js'
      - '**/Dockerfile'
      - '**/.github/workflows/docker-build-push.yml'
      - '**/package.json'
 
  pull_request:
    paths:
      - '**/app.js'
      - '**/app.test.js'
      - '**/Dockerfile'
      - '**/.github/workflows/docker-build-push.yml'
      - '**/package.json'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: andreistefanciprian
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: andreistefanciprian/nodejs-simple-app

      - name: Build and push Docker image with SBOM and provenance
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Publish image attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: docker.io/andreistefanciprian/nodejs-simple-app
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true